# Four chassis corners per (desktop, view), clicked by hand on the frames
# rendered by make_corner_sheets.py. Coordinates are pixels in the view's
# NATIVE resolution (scan 1600x1600, oak1/oak2 4032x3040, rs 1280x720) -- the
# same frame tda.core.ls_import rasterises the Label Studio drafts into.
#
# TWO PLANES ARE CLICKED, because M2 asks which one a hint should ride on:
#   rim   -- the four outer corners of the CHASSIS OPENING RIM, i.e. the lip the
#            side cover seats on. This is the top of the case.
#   floor -- the four corners of the MOTHERBOARD PCB, which lies on the chassis
#            floor. Chosen over the bare sheet-metal floor because the PCB edge
#            is a crisp, high-contrast straight line in every view, and because
#            it is the plane most annotated parts actually sit on.
# A homography is exact for one plane only; the gap between these two is the
# parallax M2 measures.
#
# NAMING: s_tl / s_tr / s_br / s_bl name the corner by where it appears in that
# desktop's SCAN frame. In the other views the SAME PHYSICAL corner is clicked,
# found through the rotation between views that the M0 overlays establish from
# where the annotated parts sit:
#     rs   = scan orientation
#     oak1 = scan rotated 90 degrees anticlockwise
#     oak2 = scan rotated 180 degrees
# (verified per desktop on the M0 overlays: the PSU, the chassis screw cover and
# the CPU socket all move as that rotation predicts.)
#
# STEP: every view is clicked on step 41, the last step on which the motherboard
# is still in the chassis in all three desktops -- late enough that the chassis
# is empty and the rim is unobstructed, early enough that the floor plane still
# has the PCB to click. m1a_pose_check.py found no camera or chassis bump inside
# any sequence (largest sustained displacement 16 px on a 4032 px OAK frame, at
# D24 step 9), so one segment per (desktop, view) covers the whole sequence and
# one set of clicks is valid for every step.
#
# CLICK UNCERTAINTY: read off labelled grids at roughly one screen pixel per
# native pixel. My own residual is about +/-10 px on scan and rs and +/-25 px on
# the 12 MP OAK frames; M3 brackets exactly this by jittering the clicks.

meta:
  clicked_by: "claude (automated probe), by eye on make_corner_sheets.py output"
  step: 41
  rim_plane: "chassis opening rim (top of case)"
  floor_plane: "motherboard PCB outline (chassis floor)"


# "No box when unsure" -- M1 of the L1 localisation experiment, wired (tasks U2h, U2i).
#
# When the difference map arms its rank-1 box prompt, the area of the blob it
# came from is compared with the area bands (in `bands`, below) of the part
# classes the frame asks to add back: the open ✚ rows of the task card.  Outside
# the band of every one of them by more than a factor `k` (a number >= 1), the
# box is withheld -- nothing armed, nothing drawn, a status line saying so; the
# heat map (D) and the Shift+C alternates stay.  A class without a band never
# withholds.  A file here that cannot be used turns the gate off with a WARNING
# in the log; a good one is logged at INFO when a window opens.
#
# Wrong boxes cut / good boxes withheld on L1's scan events (k = 3, GT-B; the
# replay is experiments/l1_localise/replay_m1_units.py):
#   L1's ROI-fraction bands, leave-one-desktop-out   72.5 % (29/40) /  5.9 % (1/17)
#   these pixel bands, leave-one-desktop-out          72.5 % (29/40) /  5.9 % (1/17)
#   these pixel bands, in-sample (the shipped fit,
#     which has seen every event's desktop)           72.5 % (29/40) /  5.9 % (1/17)
# Leave-one-desktop-out is the measurement of a machine the fit has not seen.
# L1's other views (fraction bands, leave-one-desktop-out): oak1 36.1 % / 0 %,
# oak2 62.5 % / 35.7 % (RAM, cooler, motherboard), rs 27.3 % / 0 %.  Only scan
# passes L1's bar (cut > 50 %, withhold < 15 %), so only scan is on.
#
# To turn it on for another view, add the view here: the bands file has all four,
# though off scan only a few classes have enough parts for a band.
views: [scan]
k: 3.0
# Generated by experiments/l1_localise/fit_bands.py; relative to this file.
bands: prompt_box_bands.yaml

# "No box when unsure" -- M1 of the L1 localisation experiment, wired (task U2h).
#
# When the difference map arms its rank-1 box prompt, the area of the blob it
# came from is compared with the area bands (in `bands`, below) of the part
# classes the frame asks to add back: the open ✚ rows of the task card.  Outside
# the band of every one of them by more than a factor `k`, the box is withheld --
# nothing armed, nothing drawn, a status line saying so; the heat map (D) and the
# Shift+C alternates stay.  A class without a band never withholds.
#
# L1 (experiments/l1_localise/REPORT.md, sections 4 and 8; k = 3, GT-B), wrong
# boxes cut / good boxes withheld:
#   scan  72.5 % /  5.9 %     (pixel bands as wired: 72.5 % / 11.8 %, 2 of 17)
#   oak1  36.1 % /  0 %
#   oak2  62.5 % / 35.7 %     (RAM, cooler, motherboard)
#   rs    27.3 % /  0 %
# Only scan passes L1's bar (cut > 50 %, withhold < 15 %), so only scan is on.
# The pixel-band replay is experiments/l1_localise/replay_m1_units.py.
#
# To turn it on for another view, add the view here: the bands file has all four.
views: [scan]
k: 3.0
# Generated by experiments/l1_localise/fit_bands.py; relative to this file.
bands: prompt_box_bands.yaml

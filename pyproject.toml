[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tda"
version = "0.1.0"
description = "Teardown Annotator: layered multi-view annotation tool for the desktop-PC disassembly dataset"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "opencv-python",
  "pycocotools",
  "PyYAML",
  "PySide6",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["tda*"]

[tool.setuptools.package-data]
tda = ["core/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
  "slow: wall-clock budget checks at full scanner resolution (a few seconds each)",
]
